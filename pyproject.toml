[project]
name = "modelpilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurang Sisodiya", email = "gaurangsisodiya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
modelpilot = "modelpilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
